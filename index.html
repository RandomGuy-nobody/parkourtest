<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parkour Test</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1020;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { display: block; }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 0 5px rgba(0,0,0,.9);
    pointer-events: none; z-index: 5;
  }

  #hud {
    position: fixed; left: 18px; top: 16px; z-index: 5;
    color: #eaf2ff; text-shadow: 0 2px 8px rgba(0,0,0,.7);
    font-size: 14px; line-height: 1.6;
    pointer-events: none; user-select: none;
  }
  #hud .big { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  #hud .dim { opacity: .6; }

  #hint {
    position: fixed; left: 18px; bottom: 16px; z-index: 5;
    color: #eaf2ff; opacity: .55; font-size: 13px;
    text-shadow: 0 2px 8px rgba(0,0,0,.7);
    pointer-events: none; user-select: none;
  }

  #centerMsg {
    position: fixed; left: 50%; top: 24%; transform: translateX(-50%);
    z-index: 5; color: #fff; font-size: 30px; font-weight: 800;
    text-align: center; white-space: nowrap;
    text-shadow: 0 4px 20px rgba(0,0,0,.85);
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  #centerMsg.show { opacity: 1; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: #eaf2ff; cursor: pointer;
    background: radial-gradient(circle at 50% 40%, rgba(28,44,84,.82), rgba(4,6,16,.96));
    backdrop-filter: blur(4px);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: 3px; }
  #overlay .sub { margin: 0 0 26px; opacity: .7; font-size: 15px; letter-spacing: 1px; }
  #overlay .keys { font-size: 15px; line-height: 2; opacity: .85; }
  kbd {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28);
    border-bottom-width: 2px;
    border-radius: 6px; padding: 2px 8px;
    font-family: inherit; font-size: 13px;
  }
</style>
</head>
<body>

<div id="crosshair"></div>

<div id="hud">
  <div class="big">⏱ <span id="time">0.00</span>s</div>
  <div class="dim">Falls: <span id="falls">0</span></div>
</div>

<div id="hint">
  <kbd>WASD</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>R</kbd> restart
</div>

<div id="centerMsg"></div>

<div id="overlay">
  <h1>PARKOUR TEST</h1>
  <p class="sub">reach the green pad</p>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;move<br>
    <kbd>Space</kbd> &nbsp;jump<br>
    <kbd>Shift</kbd> &nbsp;sprint<br>
    <kbd>R</kbd> &nbsp;restart &nbsp;·&nbsp; <kbd>Esc</kbd> &nbsp;release mouse
  </div>
  <p class="sub" style="margin-top:30px">click anywhere to play</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONSTANTS
   ============================================================ */
const GRAVITY        = 26;      // units / s^2
const MOVE_SPEED     = 7;       // units / s
const SPRINT_SPEED   = 11;
const JUMP_SPEED     = 10;      // ~1.9 units of jump height
const COYOTE_TIME    = 0.12;    // grace period after leaving ground
const JUMP_BUFFER    = 0.15;    // press jump slightly before landing
const EYE_OFFSET     = 0.7;     // camera height above player centre
const FIXED_DT       = 1 / 120; // physics timestep
const EPS            = 0.001;
const VOID_Y         = -18;     // fall below this -> respawn
const SPAWN          = new THREE.Vector3(0, 1.6, 3);

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc4f0);
scene.fog = new THREE.Fog(0x8fc4f0, 70, 230);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 600);
camera.rotation.order = 'YXZ';

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x39485a, 1.05));

const sun = new THREE.DirectionalLight(0xfff2d8, 1.7);
sun.position.set(62, 92, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 320;
sun.shadow.camera.left   = -72;
sun.shadow.camera.right  =  72;
sun.shadow.camera.top    =  72;
sun.shadow.camera.bottom = -72;
sun.shadow.bias = -0.0009;
sun.target.position.set(0, 5, -35);
sun.target.updateMatrixWorld();
scene.add(sun, sun.target);

/* ============================================================
   MATERIALS
   ============================================================ */
const MAT = {
  start:   new THREE.MeshStandardMaterial({ color: 0xc9d6e4, roughness: 0.9,  metalness: 0.02 }),
  platA:   new THREE.MeshStandardMaterial({ color: 0x7ec8ff, roughness: 0.7,  metalness: 0.05 }),
  platB:   new THREE.MeshStandardMaterial({ color: 0xffb86c, roughness: 0.7,  metalness: 0.05 }),
  mover:   new THREE.MeshStandardMaterial({ color: 0xd98cff, roughness: 0.55, metalness: 0.15,
                                            emissive: 0x4a1070, emissiveIntensity: 0.5 }),
  finish:  new THREE.MeshStandardMaterial({ color: 0x6bff9a, roughness: 0.45, metalness: 0.1,
                                            emissive: 0x1fbb5c, emissiveIntensity: 0.9 }),
};

/* ============================================================
   COLLIDER SYSTEM
   ============================================================ */
const colliders = [];

function syncCollider(c) {
  c.min.set(c.mesh.position.x - c.half.x, c.mesh.position.y - c.half.y, c.mesh.position.z - c.half.z);
  c.max.set(c.mesh.position.x + c.half.x, c.mesh.position.y + c.half.y, c.mesh.position.z + c.half.z);
}

function addBox(x, y, z, w, h, d, material, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const col = {
    mesh,
    half:  new THREE.Vector3(w / 2, h / 2, d / 2),
    min:   new THREE.Vector3(),
    max:   new THREE.Vector3(),
    delta: new THREE.Vector3(),
    move:  opts.move || null,
    isFinish: !!opts.isFinish,
  };
  syncCollider(col);
  colliders.push(col);
  return col;
}

/* ============================================================
   LEVEL
   ============================================================ */
addBox(0,    0,    0,     12,  1, 12,   MAT.start);              // start pad
addBox(0,    1,   -10.5,  3.5, 1, 3.5,  MAT.platA);
addBox(4,    2,   -17,    3,   1, 3,    MAT.platB);
addBox(0.5,  3,   -23.5,  3,   1, 3,    MAT.platA);
addBox(-3.5, 4,   -30,    3,   1, 3,    MAT.platB);
addBox(-3.5, 4.5, -36.5,  3,   1, 3,    MAT.platA);
addBox(0,    5.5, -43,    3,   1, 3,    MAT.platB);

// moving platform (slides left/right)
const mover = addBox(4, 6, -49, 3, 1, 3, MAT.mover, {
  move: (t) => new THREE.Vector3(4 + Math.sin(t * 1.1) * 2.6, 6, -49)
});

addBox(4,    7,   -55,    3,   1, 3,    MAT.platA);
addBox(0,    8,   -61.5,  3,   1, 3,    MAT.platB);
const finishCol = addBox(0, 8.5, -69, 8, 1, 8, MAT.finish, { isFinish: true });

// finish trigger volume (above the pad)
const finishTrigger = new THREE.Box3(
  new THREE.Vector3(-4, 9.0, -73),
  new THREE.Vector3( 4, 13.0, -65)
);

// spinning goal marker
const marker = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.75),
  new THREE.MeshStandardMaterial({ color: 0xffd54a, emissive: 0xff9f1a, emissiveIntensity: 0.8,
                                   roughness: 0.3, metalness: 0.4 })
);
marker.position.set(0, 11.6, -69);
scene.add(marker);

// decorative distant pillars (no collision)
const decoMat = new THREE.MeshStandardMaterial({ color: 0x6f8fb5, roughness: 1 });
for (let i = 0; i < 14; i++) {
  const w = 2 + Math.random() * 4;
  const h = 12 + Math.random() * 40;
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), decoMat);
  const side = i % 2 === 0 ? 1 : -1;
  p.position.set(side * (26 + Math.random() * 45), h / 2 - 14, -10 - Math.random() * 90);
  p.castShadow = false;
  p.receiveShadow = false;
  scene.add(p);
}

/* ============================================================
   PLAYER
   ============================================================ */
const player = {
  pos: new THREE.Vector3().copy(SPAWN),
  vel: new THREE.Vector3(),
  half: new THREE.Vector3(0.35, 0.9, 0.35), // 0.7 wide, 1.8 tall
  onGround: false,
  groundPlatform: null,
};

let yaw = 0, pitch = 0;
let coyote = 0;
let jumpBuffer = 0;

/* ============================================================
   INPUT
   ============================================================ */
const keys = Object.create(null);
let locked = false;

const overlay   = document.getElementById('overlay');
const centerMsg = document.getElementById('centerMsg');
const timeEl    = document.getElementById('time');
const fallsEl   = document.getElementById('falls');

function requestLock() {
  try { renderer.domElement.requestPointerLock(); } catch (e) { /* ignore */ }
}
overlay.addEventListener('click', requestLock);
renderer.domElement.addEventListener('click', () => { if (!locked) requestLock(); });

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', locked);
});

document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  const SENS = 0.0022;
  yaw   -= e.movementX * SENS;
  pitch -= e.movementY * SENS;
  const lim = Math.PI / 2 - 0.02;
  pitch = Math.max(-lim, Math.min(lim, pitch));
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Space') jumpBuffer = JUMP_BUFFER;
  if (e.code === 'KeyR')  resetRun();
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  // variable jump height: releasing early cuts the jump
  if (e.code === 'Space' && player.vel.y > 3.5) player.vel.y = 3.5;
});

window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ============================================================
   RUN STATE
   ============================================================ */
let runTime = 0;
let runStarted = false;
let finished = false;
let falls = 0;

function resetRun() {
  player.pos.copy(SPAWN);
  player.vel.set(0, 0, 0);
  player.onGround = false;
  player.groundPlatform = null;
  coyote = 0;
  jumpBuffer = 0;
  runTime = 0;
  runStarted = false;
  finished = false;
  yaw = 0;
  pitch = 0;
  centerMsg.classList.remove('show');
}

function fallRespawn() {
  falls++;
  fallsEl.textContent = falls;
  resetRun();
}

/* ============================================================
   COLLISION
   ============================================================ */
function overlaps(c) {
  return (
    player.pos.x - player.half.x < c.max.x && player.pos.x + player.half.x > c.min.x &&
    player.pos.y - player.half.y < c.max.y && player.pos.y + player.half.y > c.min.y &&
    player.pos.z - player.half.z < c.max.z && player.pos.z + player.half.z > c.min.z
  );
}

function moveAxis(axis, amount) {
  if (amount === 0) return;
  player.pos[axis] += amount;

  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (!overlaps(c)) continue;

    if (amount > 0) {
      player.pos[axis] = c.min[axis] - player.half[axis] - EPS;
    } else {
      player.pos[axis] = c.max[axis] + player.half[axis] + EPS;
    }

    if (axis === 'y') {
      if (amount < 0) {
        player.onGround = true;
        player.groundPlatform = c;
      }
      player.vel.y = 0;
    } else {
      player.vel[axis] = 0;
    }
  }
}

/* ============================================================
   MOVING PLATFORMS
   ============================================================ */
function updateMovingPlatforms(t) {
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (!c.move) continue;

    const np = c.move(t);
    c.delta.set(
      np.x - c.mesh.position.x,
      np.y - c.mesh.position.y,
      np.z - c.mesh.position.z
    );
    c.mesh.position.copy(np);
    syncCollider(c);

    // carry the player along
    if (player.groundPlatform === c) {
      player.pos.x += c.delta.x;
      player.pos.y += c.delta.y;
      player.pos.z += c.delta.z;
    }
  }
}

/* ============================================================
   PHYSICS STEP
   ============================================================ */
function stepPhysics(dt) {
  // ---- wish direction from camera yaw ----
  const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
  const fx = -sinY, fz = -cosY;   // forward
  const rx =  cosY, rz = -sinY;   // right

  let wx = 0, wz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    { wx += fx; wz += fz; }
  if (keys['KeyS'] || keys['ArrowDown'])  { wx -= fx; wz -= fz; }
  if (keys['KeyD'] || keys['ArrowRight']) { wx += rx; wz += rz; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { wx -= rx; wz -= rz; }

  const wishLen = Math.hypot(wx, wz);
  if (wishLen > 0) { wx /= wishLen; wz /= wishLen; }

  const sprinting = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = sprinting ? SPRINT_SPEED : MOVE_SPEED;

  // ---- horizontal acceleration (smooth) ----
  const rate = player.onGround ? 16 : 6;
  const f = 1 - Math.exp(-rate * dt);
  player.vel.x += (wx * speed - player.vel.x) * f;
  player.vel.z += (wz * speed - player.vel.z) * f;

  // ---- gravity ----
  player.vel.y -= GRAVITY * dt;
  if (player.vel.y < -55) player.vel.y = -55;

  // ---- jump ----
  if (jumpBuffer > 0 && coyote > 0) {
    player.vel.y = JUMP_SPEED;
    jumpBuffer = 0;
    coyote = 0;
    player.onGround = false;
    player.groundPlatform = null;
  }
  jumpBuffer = Math.max(0, jumpBuffer - dt);

  // ---- integrate + resolve, one axis at a time ----
  player.onGround = false;
  player.groundPlatform = null;
  moveAxis('x', player.vel.x * dt);
  moveAxis('z', player.vel.z * dt);
  moveAxis('y', player.vel.y * dt);

  // ---- coyote time ----
  if (player.onGround) coyote = COYOTE_TIME;
  else coyote = Math.max(0, coyote - dt);

  // ---- timer ----
  if (!runStarted && (wishLen > 0 || jumpBuffer > 0)) runStarted = true;
  if (runStarted && !finished) runTime += dt;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTime = performance.now();
let accumulator = 0;
let simTime = 0;

function animate(now) {
  requestAnimationFrame(animate);

  let frameDt = (now - lastTime) / 1000;
  lastTime = now;
  if (frameDt > 0.2) frameDt = 0.2;

  // ---------- fixed-step simulation ----------
  accumulator += frameDt;
  let steps = 0;
  while (accumulator >= FIXED_DT && steps < 8) {
    updateMovingPlatforms(simTime);
    stepPhysics(FIXED_DT);
    simTime += FIXED_DT;
    accumulator -= FIXED_DT;
    steps++;
  }
  if (steps === 8) accumulator = 0;

  // ---------- fell off the world ----------
  if (player.pos.y < VOID_Y) fallRespawn();

  // ---------- finish check ----------
  if (!finished && finishTrigger.containsPoint(player.pos)) {
    finished = true;
    centerMsg.textContent = `FINISHED!  ${runTime.toFixed(2)}s  —  press R to restart`;
    centerMsg.classList.add('show');
  }

  // ---------- camera ----------
  camera.position.set(player.pos.x, player.pos.y + EYE_OFFSET, player.pos.z);
  camera.rotation.set(pitch, yaw, 0);

  // sprint FOV kick
  const moving = keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD'];
  const sprinting = (keys['ShiftLeft'] || keys['ShiftRight']) && moving;
  const targetFov = sprinting ? 82 : 75;
  camera.fov += (targetFov - camera.fov) * Math.min(1, frameDt * 8);
  camera.updateProjectionMatrix();

  // ---------- animated bits ----------
  marker.rotation.y += frameDt * 1.4;
  marker.position.y = 11.6 + Math.sin(now * 0.002) * 0.35;

  // ---------- HUD ----------
  timeEl.textContent = runTime.toFixed(2);

  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   GO
   ============================================================ */
resetRun();
requestAnimationFrame(animate);
</script>
</body>
</html>
